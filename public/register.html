<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2-Tools – Registrieren</title>
    <meta name="description" content="Registriere dich bei M2-Tools">
    
    <!-- Core & Layout -->
    <link rel="stylesheet" href="/shared/shared.css">
    <script src="/core/theme.js"></script>
    <script src="/core/i18n.js"></script>
    <script src="/core/auth.js"></script>
    <script src="/shared/layout.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--bg-body);
        }

        /* ── Background (Same as Login) ──────────────────────── */
        /* Global Background via shared.css */

        /* ── Registration Card ─────────────────────── */
        .login-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 10;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(195, 163, 74, 0.2);
            border-radius: var(--radius-lg);
            padding: 40px 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), var(--shadow-gold-subtle);
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            position: relative;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-area { margin-bottom: 25px; }
        .logo-icon { 
            font-size: 3rem; 
            display: block; 
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }
        .logo-text { 
            font-family: var(--font-heading); 
            font-size: 1.8rem; 
            letter-spacing: 4px; 
            color: var(--text-heading); 
            margin: 0;
        }
        .logo-text .accent { color: var(--gold-primary); }
        .login-subtitle { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 5px;
        }

        /* ── Form Styling ───────────────────── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }
        .field { margin-bottom: 15px; }
        .field.full { grid-column: span 2; }
        .field label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: var(--gold-primary); 
            letter-spacing: 0.5px;
        }

        .m2-input-group {
            display: flex;
            align-items: stretch;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: all 0.3s;
        }
        .m2-input-group:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-subtle);
            background: var(--bg-hover);
        }

        .input-icon-box { 
            width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid var(--border-color);
            font-size: 1.1rem;
            color: var(--gold-primary);
        }

        .m2-input {
            flex: 1;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        /* Focus handled in group */

        .m2-btn-reg {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-accent));
            color: #000;
            border-radius: var(--radius-sm);
            transition: all 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .m2-btn-reg:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(195, 163, 74, 0.3);
            filter: brightness(1.2);
        }

        .login-footer { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .login-footer a { color: var(--gold-primary); text-decoration: none; font-weight: 700; }

        .msg { padding: 12px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 20px; display: none; line-height: 1.4; text-align: center; }
        .msg.error { background: rgba(244, 67, 54, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .msg.success { background: rgba(76, 175, 80, 0.1); border: 1px solid var(--success); color: var(--success); }
        .msg.show { display: block; }
        
        .login-controls { position: fixed; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 100; }
        .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; line-height: 1.3; }
    </style>
</head>
<body>
    <!-- Global Background via shared.css -->
    
    <div class="login-controls" data-i18n-switcher></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <span class="logo-icon">⚔️</span>
                <h1 class="logo-text">M2 <span class="accent">TOOLS</span></h1>
                <div class="login-subtitle">Registrieren</div>
            </div>

            <div class="msg success" id="register-success"></div>
            <div class="msg error" id="register-error"></div>

            <form id="register-form">
                <div class="form-grid">
                    <div class="field full">
                        <label>Benutzername</label>
                        <div class="m2-input-group">
                            <div class="input-icon-box">👤</div>
                            <input type="text" id="reg-username" class="m2-input" placeholder="Benutzername" required minlength="3" autocomplete="username">
                        </div>
                        <div class="hint">3-20 Zeichen, keine Sonderzeichen.</div>
                    </div>

                    <div class="field full">
                        <label>E-Mail Adresse</label>
                        <div class="m2-input-group">
                            <div class="input-icon-box">📧</div>
                            <input type="email" id="reg-email" class="m2-input" placeholder="deine@email.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="field">
                        <label>Passwort</label>
                        <div class="m2-input-group">
                            <div class="input-icon-box">🔒</div>
                            <input type="password" id="reg-password" class="m2-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="field">
                        <label>Wiederholen</label>
                        <div class="m2-input-group">
                            <div class="input-icon-box">🔒</div>
                            <input type="password" id="reg-password-confirm" class="m2-input" placeholder="••••••••" required autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <button type="submit" class="m2-btn-reg" id="register-submit">Konto Erstellen</button>
            </form>

            <div class="login-footer">
                Schon registriert? <a href="/login.html">Einloggen</a>
            </div>
        </div>
    </div>

    <script>
        // Use logic from existing register.html but adapted for new IDs
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            const btn = document.getElementById('register-submit');

            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;

            errEl.classList.remove('show');
            successEl.classList.remove('show');

            if (password !== passwordConfirm) {
                errEl.textContent = 'Passwörter stimmen nicht überein.';
                errEl.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Registriere...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, passwordConfirm })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('register-form').style.display = 'none';
                    successEl.innerHTML = `
                        ✅ <strong>${data.message}</strong><br><br>
                        ${data.autoVerified
                            ? '<a href="/login.html" style="color:var(--gold-primary);font-weight:700;">→ Jetzt anmelden</a>'
                            : 'Bitte prüfe dein Postfach und klicke auf den Bestätigungslink.'}
                    `;
                    successEl.classList.add('show');
                } else {
                    errEl.textContent = data.error || 'Fehler bei der Registrierung';
                    errEl.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Konto Erstellen';
                }
            } catch (err) {
                errEl.textContent = 'Server nicht erreichbar';
                errEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Konto Erstellen';
            }
        });

        // Global particles via shared.css active.
    </script>
</body>
</html>
