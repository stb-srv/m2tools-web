<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin2 Cube Editor</title>
    
    <!-- Core & Layout -->
    <link rel="stylesheet" href="/shared/shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="/core/theme.js"></script>
    <script src="/core/i18n.js"></script>
    <script src="/core/auth.js"></script>
    <script src="/shared/item_service.js"></script>
    <script src="/shared/utils.js"></script>
    <script src="/shared/layout.js"></script>
</head>
<body>
    <main class="m2-main-content">
        <!-- ── Page Header ───────────────────────────── -->
        <div class="page-header">
            <div class="header-breadcrumb">
                <a href="/index.html">Dashboard</a> / Cube Editor
            </div>
            
            <div class="header-main-row">
                <div class="title-meta">
                    <h1>CUBE <span class="gold">EDITOR</span></h1>
                    <p class="m2-hint" data-i18n="cube.subtitle">Erstelle und bearbeite deine Crafting-Rezepte professionell.</p>
                </div>
                <div class="header-actions">
                    <button class="m2-btn m2-btn-secondary" onclick="document.getElementById('import-file').click()">
                        📁 Datei öffnen
                    </button>
                    <input type="file" id="import-file" class="hidden" accept=".txt">
                    <button id="export-btn" class="m2-btn m2-btn-primary" data-i18n="cube.export">
                        📥 Download (Cube.txt)
                    </button>
                    <button id="new-recipe-btn" class="m2-btn m2-btn-secondary" data-i18n="cube.new_recipe">
                        ➕ Neues Rezept
                    </button>
                </div>
            </div>
        </div>

        <div style="padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box;">
            <section>
                <div id="item-editor" class="m2-card editor-card hidden">
                    <div class="editor-header">
                        <h2 data-i18n="cube.edit_recipe">Rezept bearbeiten</h2>
                        <div class="npc-badge">
                            <label>NPC:</label>
                            <div class="search-input-wrapper tiny">
                                <input type="text" id="npc-search" placeholder="NPC suchen..." class="m2-input">
                                <div id="npc-results" class="search-results hidden"></div>
                            </div>
                            <span id="selected-npc-name" class="npc-name-display">20017</span>
                            <input type="hidden" id="npc-vnum" value="20017">
                        </div>
                    </div>
                    <div class="editor-grid">
                        <div class="field-item">
                            <label data-i18n="cube.target_item">Ziel-Item & Anzahl</label>
                            <div class="field-row-inline">
                                <div class="search-input-wrapper">
                                    <input type="text" id="target-vnum" placeholder="Search..." class="m2-input">
                                    <div id="target-results" class="search-results hidden"></div>
                                </div>
                                <input type="number" id="target-count" value="1" min="1" max="200" class="m2-input">
                            </div>
                            <div class="item-preview" id="target-preview">
                                <img src="/basic/items/00000.png" alt="Preview" class="item-icon">
                                <span class="item-name">Kein Item ausgewählt</span>
                            </div>
                            <div id="stack-warning" class="warning-text hidden">Warnung: Item ist evtl. nicht stapelbar!</div>
                        </div>

                        <div class="field-row">
                            <div class="field-item small">
                                <label data-i18n="cube.yang_cost">Yang Kosten</label>
                                <input type="number" id="yang-cost" value="0" class="m2-input">
                            </div>
                            <div class="field-item small">
                                <label data-i18n="cube.success_chance">Erfolgschance (%)</label>
                                <input type="number" id="success-chance" value="100" min="1" max="100" class="m2-input">
                            </div>
                        </div>

                        <div class="materials-section">
                            <h3 data-i18n="cube.materials">Benötigte Materialien (Max 5)</h3>
                            <div id="materials-container">
                                <!-- Materials will be added here -->
                            </div>
                            <button id="add-material-btn" class="m2-btn m2-btn-secondary small">+ Weiteres Item</button>
                        </div>
                    </div>
                    <div class="card-footer" style="margin-top: 20px; display:flex; gap: 10px;">
                        <button id="save-recipe-btn" class="m2-btn m2-btn-primary">Speichern</button>
                        <button id="cancel-edit-btn" class="m2-btn m2-btn-secondary">Abbrechen</button>
                    </div>
                </div>
            </section>

            <section class="recipes-section">
                <h2 data-i18n="cube.current_recipes">Aktuelle Rezepte</h2>
                <div id="recipes-list" class="recipe-grid">
                    <!-- Recipes will be listed here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Templates -->
    <template id="material-row-template">
        <div class="material-row">
            <div class="material-icon-box">
                <img src="/shared/assets/no_icon.png" alt="Icon" class="material-preview-img">
            </div>
            <div class="material-main">
                <div class="search-input-wrapper">
                    <input type="text" class="material-vnum m2-input" placeholder="VNUM / Name suchen...">
                    <div class="search-results hidden"></div>
                </div>
                <div class="material-info">
                    <div class="material-name-display">Kein Item ausgewählt</div>
                </div>
            </div>
            <div class="material-qty">
                <label>Anzahl</label>
                <input type="number" class="material-count m2-input" value="1" min="1">
            </div>
            <button class="remove-material-btn" title="Entfernen">×</button>
        </div>
    </template>

    <script src="app.js"></script>
</body>

</html>
