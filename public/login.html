<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2-Tools – Login</title>
    <meta name="description" content="Anmelden bei M2-Tools">
    
    <!-- Core & Layout -->
    <link rel="stylesheet" href="/shared/shared.css">
    <script src="/core/theme.js"></script>
    <script src="/core/i18n.js"></script>
    <script src="/core/auth.js"></script>
    <script src="/shared/layout.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--bg-body);
        }

        /* ── Background ──────────────────────── */
        /* Using Global Animated Background from shared.css */

        /* ── Login Card ─────────────────────── */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(195, 163, 74, 0.2);
            border-radius: var(--radius-lg);
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), var(--shadow-gold-subtle);
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            position: relative;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, transparent, rgba(195, 163, 74, 0.3), transparent);
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-area { margin-bottom: 35px; }
        .logo-icon { 
            font-size: 3.5rem; 
            display: block; 
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }
        .logo-text { 
            font-family: var(--font-heading); 
            font-size: 2.2rem; 
            letter-spacing: 4px; 
            color: var(--text-heading); 
            margin: 0;
        }
        .logo-text .accent { color: var(--gold-primary); }
        .login-subtitle { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 5px;
        }

        /* ── Form Styling ───────────────────── */
        .field { margin-bottom: 25px; text-align: left; }
        .field label { 
            display: block; 
            margin-bottom: 10px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--gold-primary); 
            letter-spacing: 0.5px;
        }

        .m2-input-group {
            display: flex;
            align-items: stretch;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: all 0.3s;
        }
        .m2-input-group:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-subtle);
            background: var(--bg-hover);
        }

        .input-icon-box { 
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid var(--border-color);
            font-size: 1.2rem;
            color: var(--gold-primary);
        }

        .m2-input {
            flex: 1;
            padding: 14px 15px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }
        /* Focus handled in group */

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .password-toggle:hover { opacity: 1; color: var(--gold-primary); }

        .m2-btn-login {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 15px;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-accent));
            color: #000;
            border-radius: var(--radius-sm);
            transition: all 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .m2-btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(195, 163, 74, 0.3);
            filter: brightness(1.2);
        }
        .m2-btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Footer Link ────────────────────── */
        .login-footer { margin-top: 30px; font-size: 0.9rem; color: var(--text-muted); }
        .login-footer a { color: var(--gold-primary); text-decoration: none; font-weight: 700; }
        .login-footer a:hover { text-decoration: underline; }

        .back-to-home { margin-top: 20px; font-size: 0.8rem; }
        .back-to-home a { color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .back-to-home a:hover { color: var(--gold-primary); }

        /* Error/Success Messages */
        .msg {
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            line-height: 1.4;
        }
        .msg.error { background: rgba(244, 67, 54, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .msg.success { background: rgba(76, 175, 80, 0.1); border: 1px solid var(--success); color: var(--success); }
        .msg.show { display: block; }

        .verification-hint { background: rgba(255,152,0,0.12); border: 1px solid rgba(255,152,0,0.3); color: #ffb74d; padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 20px; display: none; line-height: 1.5; text-align: center; }
        .verification-hint.show { display: block; }
        .resend-btn { color: var(--gold-primary); cursor: pointer; text-decoration: underline; background: none; border: none; font: inherit; padding: 0; }
        
        .login-controls { position: fixed; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 100; }
    </style>
</head>
<body>
    <!-- Global Background active via shared.css -->
    
    <div class="login-controls" data-i18n-switcher>
        <!-- Injected by layout.js -->
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <span class="logo-icon">⚔️</span>
                <h1 class="logo-text">M2 <span class="accent">TOOLS</span></h1>
                <div class="login-subtitle">Anmelden</div>
            </div>

            <div class="msg success" id="verified-msg">✅ E-Mail erfolgreich bestätigt! Du kannst dich jetzt anmelden.</div>
            <div class="verification-hint" id="verification-hint">
                ⚠️ Account noch nicht bestätigt.<br>
                <button type="button" class="resend-btn" id="resend-link">Bestätigung erneut senden</button>
            </div>
            <div class="msg error" id="login-error"></div>

            <form id="login-form">
                <div class="field">
                    <label>Benutzername</label>
                    <div class="m2-input-group">
                        <div class="input-icon-box">👤</div>
                        <input type="text" id="login-username" class="m2-input" placeholder="Benutzername oder E-Mail" required autocomplete="username">
                    </div>
                </div>

                <div class="field">
                    <label>Passwort</label>
                    <div class="m2-input-group" style="position: relative;">
                        <div class="input-icon-box">🔒</div>
                        <input type="password" id="login-password" class="m2-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="toggle-password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="m2-btn-login" id="login-submit">Einloggen</button>
            </form>

            <div class="login-footer">
                Noch keinen Account? <a href="/register.html">Registrieren</a>
            </div>
            
            <div class="back-to-home">
                <a href="/index.html">← Zurück zum Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        // Check for verification success
        if (new URLSearchParams(window.location.search).get('verified') === 'true') {
            document.getElementById('verified-msg').classList.add('show');
        }

        // Background is now handled via global CSS particles and animated layer.

        // Password toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('login-password');
            input.type = input.type === 'password' ? 'text' : 'password';
            this.textContent = input.type === 'password' ? '👁️' : '🙈';
        });

        // Redirect if already logged in
        if (localStorage.getItem('m2em_token')) {
            const redirect = new URLSearchParams(window.location.search).get('redirect');
            window.location.href = redirect || '/index.html';
        }

        let lastLoginEmail = '';

        // Handle login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            const verHint = document.getElementById('verification-hint');
            const btn = document.getElementById('login-submit');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            errEl.classList.remove('show');
            verHint.classList.remove('show');

            if (!username || !password) {
                errEl.textContent = 'Bitte alle Felder ausfüllen.';
                errEl.classList.add('show');
                return;
            }

            lastLoginEmail = username;
            btn.disabled = true;
            btn.innerHTML = '<span class="m2-spin">⏳</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('m2em_token', data.token);
                    localStorage.setItem('m2em_user', JSON.stringify(data.user));
                    const redirect = new URLSearchParams(window.location.search).get('redirect');
                    window.location.href = redirect || '/index.html';
                } else {
                    if (data.needsVerification) {
                        verHint.classList.add('show');
                    }
                    errEl.textContent = data.error || 'Login fehlgeschlagen';
                    errEl.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Einloggen';
                }
            } catch (err) {
                errEl.textContent = 'Server nicht erreichbar';
                errEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Einloggen';
            }
        });

        // Resend Verification
        document.getElementById('resend-link').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: lastLoginEmail })
                });
                const data = await res.json();
                window.m2Toast(data.message || 'Verifikation erneut gesendet.', 'success');
            } catch { window.m2Toast('Server nicht erreichbar', 'error'); }
        });

    </script>
</body>
</html>
