services:
  m2-tools:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_TYPE: sqlite
      # Both of these are optional here - if left unset, the in-app setup
      # wizard (visit the app for the first time) generates and persists
      # them into the data/ volume automatically. Set them here instead
      # only if you'd rather manage secrets yourself and skip the wizard;
      # doing so also disables it (the app boots straight to normal
      # operation with the usual random-admin-in-logs fallback). Generate
      # with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" # CREDENTIALS_ENCRYPTION_KEY
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))" # JWT_SECRET
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - m2tools-data:/app/data
      - m2tools-basic:/app/public/basic
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  m2tools-data:
  m2tools-basic:
