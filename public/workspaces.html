<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2-Tools – Workspace Manager</title>
    
    <!-- Core & Layout -->
    <link rel="stylesheet" href="/shared/shared.css">
    <script src="/core/theme.js"></script>
    <script src="/core/i18n.js"></script>
    <script src="/core/auth.js"></script>
    <script src="/shared/utils.js"></script>
    <script src="/shared/layout.js"></script>

    <style>
        .ws-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .ws-header { text-align: center; margin-bottom: 50px; }
        .ws-header h1 { font-size: 3rem; font-family: var(--font-heading); color: var(--text-heading); }
        .ws-header h1 .accent { color: var(--gold-primary); text-shadow: 0 0 15px var(--gold-glow); }
        .ws-header p { color: var(--text-secondary); margin-top: 10px; }

        .ws-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-bottom: 40px; }
        
        .ws-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 25px; position: relative; transition: all 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 240px;
        }
        .ws-card:hover { border-color: var(--gold-primary); transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .ws-card.active { border-color: var(--gold-primary); box-shadow: 0 0 25px rgba(212, 175, 55, 0.15); }
        
        .ws-card-body { flex: 1; }
        .ws-card-title { font-size: 1.25rem; color: var(--text-heading); margin-bottom: 8px; font-weight: 700; font-family: var(--font-heading); }
        .ws-card-path { font-size: 0.8rem; color: var(--text-muted); word-break: break-all; margin-bottom: 12px; font-family: var(--font-mono); }
        .ws-card-desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.4; margin-bottom: 20px; color: var(--text-muted); }

        .ws-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border-color); }
        
        /* Smaller buttons for cards */
        .m2-btn-sm { padding: 6px 12px; font-size: 0.8rem; height: 32px; }
        
        .badge-active { position: absolute; top: 15px; right: 15px; background: var(--gold-primary); color: #000; font-size: 0.65rem; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-full); box-shadow: 0 0 10px var(--gold-glow); }

        /* Form Modal */
        .m2-modal-body input, .m2-modal-body textarea { margin-top: 10px; width: 100%; }
        .m2-modal-body label { font-size: 0.85rem; color: var(--text-muted); margin-top: 15px; display: block; }
    </style>
</head>
<body>
    <main class="ws-container">
        <div style="margin-bottom: 20px;">
            <a href="/index.html" class="m2-btn m2-btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
                ⬅ <span data-i18n="workspaces.back">Dashboard</span>
            </a>
        </div>

        <header class="ws-header">
            <h1><span data-i18n="workspaces.title">WORKSPACES</span> <span class="accent" data-i18n="workspaces.title_accent">MANAGER</span></h1>
            <p data-i18n="workspaces.subtitle">Verwalte verschiedene Server-Profile und Projekte.</p>
        </header>

        <div class="ws-grid" id="ws-grid">
            <!-- Dynamic Cards -->
        </div>

        <div style="text-align: center;">
            <button class="m2-btn m2-btn-primary" onclick="showCreateModal()">
                ✨ <span data-i18n="workspaces.add_new">Neuen Workspace anlegen</span>
            </button>
        </div>
    </main>

    <script>
        async function loadWorkspaces() {
            if (!window.m2Auth) { setTimeout(loadWorkspaces, 50); return; }
            
            try {
                const workspacesRes = await window.m2Auth.authFetch('/api/workspaces');
                const data = await workspacesRes.json();
                const workspaces = data.workspaces || [];
                const activeId = data.activeId;
                
                const teamsRes = await window.m2Auth.authFetch('/api/teams');
                window.userTeams = await teamsRes.json();

                const grid = document.getElementById('ws-grid');
                grid.innerHTML = '';

                if (workspaces.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: var(--text-muted);" data-i18n="workspaces.empty">Noch keine Workspaces vorhanden.</div>`;
                }

                workspaces.forEach(ws => {
                    const card = document.createElement('div');
                    const isActive = activeId === ws.id;
                    card.className = `ws-card ${isActive ? 'active' : ''}`;
                    
                    // Find team name if applicable
                    let teamLabel = '';
                    if (ws.team_id) {
                        const team = window.userTeams.find(t => t.id === ws.team_id);
                        teamLabel = `<div style="font-size:0.7rem; color:var(--gold-secondary); margin-bottom:5px;"><i class="fas fa-users"></i> TEAM: ${team ? team.name : 'Unknown'}</div>`;
                    } else {
                        teamLabel = `<div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:5px;"><i class="fas fa-user"></i> PERSONAL</div>`;
                    }

                    card.innerHTML = `
                        ${isActive ? `<span class="badge-active">AKTIV</span>` : ''}
                        <div class="ws-card-body">
                            ${teamLabel}
                            <div class="ws-card-title">${window.m2Safe.escape(ws.name)}</div>
                            <div class="ws-card-path">📂 ${window.m2Safe.escape(ws.base_path || 'Nicht festgelegt')}</div>
                            <div class="ws-card-desc">${window.m2Safe.escape(ws.description || '-')}</div>
                        </div>
                        <div class="ws-actions">
                            ${!isActive ? `<button class="m2-btn m2-btn-primary m2-btn-sm" onclick="selectWorkspace(${ws.id})">Aktivieren</button>` : ''}
                            <a href="/workspace_settings.html?id=${ws.id}" class="m2-btn m2-btn-secondary m2-btn-sm" style="text-decoration:none;">⚙️ Settings</a>
                            <button class="m2-btn m2-btn-secondary m2-btn-sm" onclick="deleteWorkspace(${ws.id})">Löschen</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (window.m2i18n) window.m2i18n.refresh();
            } catch (e) {
                console.error(e);
                window.m2Toast('Fehler beim Laden', 'error');
            }
        }

        function showCreateModal() {
            const teamOptions = (window.userTeams || []).map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            
            const content = `
                <div class="m2-field-group">
                    <label data-i18n="workspaces.name">Name</label>
                    <input type="text" id="ws-name" class="m2-input" placeholder="Mein Projekt" required>
                    
                    <label data-i18n="workspaces.team">Zugehöriges Team</label>
                    <select id="ws-team" class="m2-input">
                        <option value="" data-i18n="workspaces.personal">Persönlich (Privat)</option>
                        ${teamOptions}
                    </select>

                    <label data-i18n="workspaces.description">Beschreibung</label>
                    <textarea id="ws-desc" class="m2-input" style="height: 60px;" placeholder="Kurze Info..."></textarea>
                    
                    <label data-i18n="workspaces.base_path">Server-Pfad (Basis)</label>
                    <input type="text" id="ws-path" class="m2-input" placeholder="C:\\Metin2Server\\share\\locale\\germany">
                </div>
            `;
            
            window.m2Layout.createModal(window.m2i18n.t('workspaces.add_new'), content, [
                { text: 'Abbrechen', class: 'm2-btn-secondary', onclick: (modal) => modal.close() },
                { text: 'Speichern', class: 'm2-btn-primary', onclick: async (modal) => {
                    const name = document.getElementById('ws-name').value;
                    const description = document.getElementById('ws-desc').value;
                    const base_path = document.getElementById('ws-path').value;
                    const team_id = document.getElementById('ws-team').value;
                    
                    if (!name) return window.m2Toast('Bitte Name angeben', 'warning');
                    
                    const res = await window.m2Auth.authFetch('/api/workspaces', {
                        method: 'POST',
                        body: JSON.stringify({ name, description, base_path, team_id: team_id ? parseInt(team_id) : null })
                    });
                    
                    if (res.ok) {
                        window.m2Toast('Workspace erstellt', 'success');
                        modal.close();
                        loadWorkspaces();
                    }
                }}
            ]);
        }

        async function selectWorkspace(id) {
            const res = await window.m2Auth.authFetch('/api/workspaces/select', {
                method: 'POST',
                body: JSON.stringify({ id })
            });
            if (res.ok) {
                window.m2Toast('Erfolgreich gewechselt', 'success');
                loadWorkspaces();
            }
        }

        function deleteWorkspace(id) {
            window.m2Confirm('Löschen?', 'Willst du diesen Workspace wirklich löschen?', async () => {
                const res = await window.m2Auth.authFetch(`/api/workspaces/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    window.m2Toast('Gelöscht', 'success');
                    loadWorkspaces();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadWorkspaces);
    </script>
</body>
</html>
