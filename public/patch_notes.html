<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2-Tools – Patch Notes</title>
    
    <!-- Core & Layout -->
    <link rel="stylesheet" href="/shared/shared.css">
    <script src="/core/theme.js"></script>
    <script src="/core/i18n.js"></script>
    <script src="/core/auth.js"></script>
    <script src="/shared/layout.js"></script>

    <style>
        .patch-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .patch-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .patch-header h1 {
            font-size: 3rem;
            font-family: var(--font-heading);
            color: var(--text-heading);
            margin-bottom: 10px;
        }
        .patch-header h1 .accent { color: var(--gold-primary); text-shadow: 0 0 15px var(--gold-glow); }
        .patch-header p { color: var(--text-secondary); font-size: 1.1rem; }

        .patch-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .filter-btn:hover { border-color: var(--gold-primary); color: var(--text-heading); }
        .filter-btn.active { background: var(--gold-primary); color: #000; border-color: var(--gold-primary); font-weight: 600; }

        /* Timeline Layout */
        .timeline {
            position: relative;
            padding-left: 50px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--gold-primary), transparent);
        }

        .patch-entry {
            position: relative;
            margin-bottom: 50px;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .patch-dot {
            position: absolute;
            left: -38px;
            top: 5px;
            width: 16px;
            height: 16px;
            background: var(--bg-main);
            border: 3px solid var(--gold-primary);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .patch-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }
        .patch-card:hover { transform: translateY(-5px); border-color: rgba(212, 175, 55, 0.3); }

        .patch-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .patch-module-tag {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .patch-title-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .patch-version {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold-primary);
            font-family: var(--font-heading);
        }
        .patch-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .patch-type-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .type-feature { background: #4CAF50; color: white; }
        .type-fix { background: #2196F3; color: white; }
        .type-improvement { background: #9C27B0; color: white; }

        .patch-content {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .patch-title-row { flex-direction: column; align-items: flex-start; gap: 5px; }
            .patch-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <main class="patch-container">
        <div style="margin-bottom: 20px;">
            <a href="/index.html" class="m2-btn m2-btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
                ⬅ <span data-i18n="quest_builder.back_dashboard">Dashboard</span>
            </a>
        </div>

        <header class="patch-header">
            <h1><span data-i18n="patch_notes.title">PATCH</span> <span class="accent" data-i18n="patch_notes.title_accent">NOTES</span></h1>
            <p data-i18n="patch_notes.subtitle">Bleib auf dem Laufenden über die neuesten Funktionen und Verbesserungen.</p>
        </header>

        <nav class="patch-filters" id="module-filters">
            <button class="filter-btn active" data-mod="all" data-i18n="patch_notes.all_updates">Alle Updates</button>
            <!-- Dynamic Filters -->
        </nav>

        <section class="timeline" id="patch-timeline">
            <!-- Dynamic Entries -->
            <div style="text-align:center; padding: 50px; color: var(--text-muted);" data-i18n="patch_notes.loading">Lade Protokolle...</div>
        </section>
    </main>

    <script>
        let allChunks = [];
        let activeModule = 'all';

        async function loadChangelogs() {
            // Wait for i18n to be ready
            if (!window.m2i18n) { setTimeout(loadChangelogs, 50); return; }

            try {
                // Fetch modules for naming
                const modRes = await fetch('/api/auth/modules/status');
                const modules = await modRes.json();
                
                // Fetch changelogs
                const res = await fetch('/api/admin/changelogs');
                allChunks = await res.json();
                
                // Sort by date desc
                allChunks.sort((a, b) => new Date(b.date) - new Date(a.date));

                renderFilters(modules);
                renderTimeline();
                
                // Trigger re-translation
                if (window.m2i18n) window.m2i18n.updateUI();
            } catch (e) {
                document.getElementById('patch-timeline').innerHTML = `<div style="color:var(--error)">${window.m2i18n.t('patch_notes.error_loading')}</div>`;
            }
        }

        function renderFilters(modules) {
            const filterContainer = document.getElementById('module-filters');
            modules.forEach(m => {
                if (m.id === 'item_manager') return;
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = m.name;
                btn.dataset.mod = m.id;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeModule = m.id;
                    renderTimeline();
                };
                filterContainer.appendChild(btn);
            });
            
            // Re-setup "All" btn
            const allBtn = filterContainer.querySelector('[data-mod="all"]');
            allBtn.onclick = (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                activeModule = 'all';
                renderTimeline();
            };
        }

        function renderTimeline() {
            const timeline = document.getElementById('patch-timeline');
            timeline.innerHTML = '';

            const filtered = activeModule === 'all' 
                ? allChunks 
                : allChunks.filter(c => c.moduleId === activeModule);

            if (filtered.length === 0) {
                timeline.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted)">${window.m2i18n.t('patch_notes.no_entries')}</div>`;
                return;
            }

            filtered.forEach((item, index) => {
                const entry = document.createElement('div');
                entry.className = 'patch-entry';
                entry.style.animationDelay = `${index * 0.1}s`;

                const typeIcons = { feature: '✨', fix: '🛠️', improvement: '🚀' };
                const typeLabels = { 
                    feature: window.m2i18n.t('quest_builder.action_types.give_item') ? 'Feature' : 'Feature', // Simplified
                    fix: 'Fix', 
                    improvement: 'Optimierung' 
                };

                entry.innerHTML = `
                    <div class="patch-dot"></div>
                    <div class="patch-card">
                        <div class="patch-meta">
                            <span class="patch-module-tag">${item.moduleId.replace(/_/g, ' ')}</span>
                            <span>${window.m2i18n.t('patch_notes.date_prefix')} ${new Date(item.date).toLocaleDateString(window.m2i18n.currentLang() === 'de' ? 'de-DE' : 'en-US')}</span>
                        </div>
                        <div class="patch-title-row">
                            <span class="patch-version">${window.m2i18n.t('patch_notes.version_prefix')}${item.version}</span>
                            <span class="patch-title">${item.title}</span>
                            <span class="patch-type-pill type-${item.type}">
                                ${typeIcons[item.type] || '📝'} ${item.type.charAt(0).toUpperCase() + item.type.slice(1)}
                            </span>
                        </div>
                        <div class="patch-content">
                            ${item.content}
                        </div>
                    </div>
                `;
                timeline.appendChild(entry);
            });
        }

        document.addEventListener('DOMContentLoaded', loadChangelogs);
        window.addEventListener('m2-lang-changed', renderTimeline);
    </script>
</body>
</html>
